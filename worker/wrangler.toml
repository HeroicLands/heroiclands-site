# heroiclands-router — see src/index.js.
#
# One wildcard route: every request to the hostname reaches the script, and the
# script decides. A package prefix is proxied to that package's own hosting
# project, and every other path to this site's own Pages project. A route per
# package would name every package in this file, which is what a package must
# not have to do: a package is publishable from its own repository.
# What keeps a fault on one prefix off the rest of the site is the handler's
# `try`/`catch`, which falls through to this site's own origin.
#
# Adding a package is no change here, or anywhere in this repository. The
# origin is derived from the prefix (see src/router.js); the package's own
# deploy gives its hosting project the matching custom domain.

name = "heroiclands-router"
main = "src/index.js"

# Deliberately behind the runtime's newest: this date is also what `wrangler dev`
# runs against locally, and a date the installed wrangler's bundled runtime does
# not know refuses to start. Nothing here depends on a newer runtime.
compatibility_date = "2026-04-16"

# No *.workers.dev address. The Worker exists to serve one hostname's prefixes;
# a second public address for it would be another way to reach the packages,
# with none of the paths right.
workers_dev = false

# Everything on the hostname. A request outside a package prefix (`routeFor`
# returns nothing) is proxied to this site's own Pages project, so the router is
# on its path but makes no decision about it.
#
# The apex is not listed: `heroiclands.org` 301s to `www` by a Cloudflare rule
# before any of this, so the router never needs to see it.
[[routes]]
pattern = "www.heroiclands.org/*"
zone_name = "heroiclands.org"
