# heroiclands-router — see src/index.js.
#
# One wildcard route: every request to the hostname reaches the script, and the
# script decides. It used to be a pair of narrow routes per package, so that
# everything else was served by this repository's GitHub Pages deploy without
# the router being involved at all — "a broken router cannot take the site down,
# only the prefixes it claims."
#
# That property was worth having, and it is not given up here so much as moved.
# The narrow routes bought it at the cost of naming every package in this file,
# which is exactly what a package must not have to do (issue #25): a package is
# publishable from its own repository, so this file cannot be the place its
# existence is recorded. What replaces the routes is the handler's `try`/`catch`,
# which falls through to `fetch(request)` on any fault — the same guarantee,
# applied more completely, since it also covers a fault on a prefix the router
# *does* claim, which the narrow routes never did.
#
# Adding a package is no longer a change here, or anywhere in this repository.
# The origin is derived from the prefix (see src/router.js); the package's own
# deploy gives its hosting project the matching custom domain.

name = "heroiclands-router"
main = "src/index.js"

# Deliberately behind the runtime's newest: this date is also what `wrangler dev`
# runs against locally, and a date the installed wrangler's bundled runtime does
# not know refuses to start. Nothing here depends on a newer runtime.
compatibility_date = "2026-04-16"

# No *.workers.dev address. The Worker exists to serve one hostname's prefixes;
# a second public address for it would be another way to reach the packages,
# with none of the paths right.
workers_dev = false

# Everything on the hostname. Requests outside a package prefix are handed
# straight back to the origin by the handler (`routeFor` returns nothing), so
# they are served by this repository's deploy exactly as before — the router
# is now on their path, but makes no decision about them.
#
# The apex is not listed: `heroiclands.org` 301s to `www` by a Cloudflare rule
# before any of this, so the router never needs to see it.
[[routes]]
pattern = "www.heroiclands.org/*"
zone_name = "heroiclands.org"
