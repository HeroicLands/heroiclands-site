name: Deploy to GitHub Pages

# This repository authors its own content, so a push to main is the only
# thing that changes what it publishes. Package content is built and deployed
# by the repository that owns it (see DEPLOYMENT.md); nothing here rebuilds
# when a package changes.
on:
  push:
    branches: [main]
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v6

      # The shared brand theme is an npm dependency rather than a submodule
      # (Song-of-Heroic-Lands-FoundryVTT#1642), so it has to be installed
      # before Hugo runs. `npm ci` installs from the lockfile, which is the
      # whole of this site's Node footprint: one package.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the theme
        run: npm ci

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # `hugo.Data` (used in layouts) requires >= 0.156.0; pinning to
          # 0.163.3 (latest extended release as of June 2026).
          hugo-version: "0.163.3"
          extended: true

      - name: Build Hugo site
        run: hugo --minify
        env:
          HUGO_ENVIRONMENT: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
