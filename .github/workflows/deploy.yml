name: Deploy to GitHub Pages

# Publishes heroiclands.org through GitHub Pages. It runs on GitHub when the
# Gitea push mirror delivers `main`; it is the one workflow here that runs on push.

# This repository authors its own content, so a push to main is the only
# thing that changes what it publishes. Package content is built and deployed
# by the repository that owns it (see DEPLOYMENT.md); nothing here rebuilds
# when a package changes.
on:
    push:
        branches: [main]
    # Allow triggering manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout site repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # The shared brand theme is an npm dependency rather than a submodule
            # (Song-of-Heroic-Lands-FoundryVTT#1642), so it has to be installed
            # before Hugo runs. `npm ci` installs from the lockfile, which is the
            # whole of this site's Node footprint: one package.
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install the theme
              run: npm ci

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
              with:
                  # `hugo.Data` (used in layouts) requires >= 0.156.0; pinning to
                  # 0.163.3 (latest extended release as of June 2026).
                  hugo-version: "0.163.3"
                  extended: true

            - name: Build Hugo site
              run: hugo --minify
              env:
                  HUGO_ENVIRONMENT: production

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
              with:
                  path: ./public

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
