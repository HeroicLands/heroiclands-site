name: Worker tests

# The gate `deploy-worker.yml` cannot be. That workflow runs the same suite, but
# on push to `main` — the trigger that also deploys — so it reports on a router
# after the decision it exists to inform, and on this repository merging *is*
# deploying.
#
# The Worker claims a single wildcard route, so every request to
# www.heroiclands.org enters the router, and a router change that breaks it
# breaks every path. The suite therefore has to be able to fail the pull
# request.
#
# This adds a gate; it moves none. `deploy-worker.yml` is untouched.

on:
    pull_request:
        paths:
            # The router itself, obviously.
            - "worker/**"
            # And the inputs to the suite's drift check, which reads
            # `package-build.config.yaml`'s sections and the theme's `static/`
            # and fails when something this site publishes is missing from
            # `SITE_SEGMENTS`. A new section reaches the router by being added
            # there, not by anyone editing `worker/`, so a pull request that adds
            # one has to run it.
            - "package-build.config.yaml"
            # The package roster and its committed projections. The suite checks
            # that the router resolves every package the roster names, that none
            # of them collides with one of this site's own sections, that the
            # sitemap index names every one of them, and that the committed
            # `data/roster.json` and `static/nav.json` are still what
            # `roster.mjs` would write. All of these go stale from an edit here
            # rather than one under `worker/`.
            - "roster.mjs"
            - "data/**"
            - "static/**"
            - "utils/build-roster.mjs"
            - "package.json"
            - "package-lock.json"
            - ".gitea/workflows/worker-test.yml"

permissions:
    contents: read

# A push to a pull request supersedes the run in flight on it; nothing here
# deploys, so there is nothing to protect by letting a stale run finish.
concurrency:
    group: worker-test-${{ github.head_ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Router suite
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            # Not for the Worker, which has no dependencies: for the theme. The
            # drift check reads the theme's `static/` directories and skips that
            # half of itself when they are absent, so installing here is the
            # difference between checking what this site publishes and checking
            # only the sections its configuration names.
            - name: Install dependencies
              run: npm ci

            - name: Test the router
              working-directory: worker
              run: npm test
