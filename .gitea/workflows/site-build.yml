name: Site build

# The same gate as the Worker's, on the other half of the repository: the site
# is built before a change lands on `main`, because a push to `main` publishes.
# A content or configuration error is caught here rather than by the deploy
# that is meant to ship it.
#
# The stakes differ. A failed build fails `deploy-site.yml` and Pages keeps
# serving the previous deploy, so the cost is a broken deploy, not a broken
# site; a bad router deploys successfully and takes the hostname with it. This
# check is the cheap half of the pair, not the urgent one.
#
# It builds exactly what `deploy-site.yml` builds, on the same Node, and stops
# short of publishing it.

on:
    pull_request:
        paths:
            - "content/**"
            - "static/**"
            - "package-build.config.yaml"
            - "package.json"
            - "package-lock.json"
            - "prettier.config.js"
            - ".prettierignore"
            - "**/*.md"
            - "**/*.mjs"
            - "**/*.js"
            - "**/*.yml"
            - ".gitea/workflows/site-build.yml"

permissions:
    contents: read

concurrency:
    group: site-build-${{ github.head_ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Site build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Prettier over the whole tree.
            - name: Check formatting
              run: npm run format:check

            # markdownlint: document structure, and links that do not link.
            - name: Check markdown
              if: ${{ !cancelled() }}
              run: npm run lint:markdown

            # Checks the roster's projections are current, then builds what
            # publishes.
            - name: Build the site
              run: npm run build

            # Fails the build if a page or the configuration asks for an asset
            # address the CDN does not actually serve.
            - name: Check that referenced assets are published
              run: npm run check:assets
